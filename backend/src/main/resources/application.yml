server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: ai-mail-manager-backend

# ------------------------------------------------------------------------------
# Google Gemini AI Configuration
# ------------------------------------------------------------------------------
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:30}

# ------------------------------------------------------------------------------
# Google OAuth & Mail Provider Configuration
# ------------------------------------------------------------------------------
mail:
  provider-type: ${MAIL_PROVIDER_TYPE:MOCK} # Options: MOCK | GMAIL
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/oauth2/callback/google}
    application-name: "AI Mail Manager"

# ------------------------------------------------------------------------------
# CORS Configuration
# ------------------------------------------------------------------------------
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# ------------------------------------------------------------------------------
# SpringDoc / OpenAPI
# ------------------------------------------------------------------------------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
logging:
  level:
    root: INFO
    com.mailmanager: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO

---
# ==============================================================================
# Spring Profile: prod  (active on Render.com)
# ==============================================================================
# Render injects PORT automatically. We map it to SERVER_PORT so Spring Boot
# binds to the correct port. All other settings are driven by env vars.
spring:
  config:
    activate:
      on-profile: prod

server:
  port: ${PORT:${SERVER_PORT:8080}}

logging:
  level:
    root: WARN
    com.mailmanager: INFO
