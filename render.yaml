# ==============================================================================
# Render.com Blueprint - AI Mail Manager
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================
services:
  - type: web
    name: ai-mail-manager
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/v1/health

    envVars:
      # Render injects PORT automatically; prod profile reads it via ${PORT:...}
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # ---- AI ----------------------------------------------------------------
      - key: GEMINI_API_KEY
        sync: false        # Set this secret in the Render dashboard
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

      # ---- Mail Provider -----------------------------------------------------
      - key: MAIL_PROVIDER_TYPE
        value: MOCK        # Change to GMAIL once OAuth creds are configured

      # ---- Google OAuth (only needed for GMAIL provider) --------------------
      - key: GOOGLE_CLIENT_ID
        sync: false        # Set in Render dashboard
      - key: GOOGLE_CLIENT_SECRET
        sync: false        # Set in Render dashboard
      - key: GOOGLE_REDIRECT_URI
        sync: false        # e.g. https://mymailai.onrender.com/api/auth/oauth2/callback/google

      # ---- CORS --------------------------------------------------------------
      # Since frontend is served from the same origin as the API in production,
      # CORS is only needed for local dev. Set this to your Render URL anyway:
      - key: CORS_ALLOWED_ORIGINS
        value: https://mymailai.onrender.com
